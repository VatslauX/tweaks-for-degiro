<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>DEGIRO transactions mock</title>
  <style>body { font-family: Inter, sans-serif; margin: 0; } td, th { padding: 4px 8px; text-align: left; white-space: nowrap; box-sizing: border-box; }
    /* like DEGIRO: the table fills the width, Product is pinned at 320px, the rest share the spare width */
    #transactions { width: 100%; } #transactions tr > :first-child { width: 320px; min-width: 320px; max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
    /* like DEGIRO's: a full-height column (logo, primary nav, bottom nav) that doesn't scroll or shrink. Here it
       floats over the page's left edge instead of taking width, which the table specs measure; only its links
       take clicks */
    [data-name=sideNavigation] { pointer-events: none; } [data-name=sideNavigation] a { pointer-events: auto; }
    [data-name=sideNavigation] { position: fixed; left: 0; right: auto; top: 0; width: 72px; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; overflow-y: visible; border: 0; background: #fff; }
    [data-name=sideNavigation] nav { flex: none; display: flex; flex-direction: column; gap: 8px; } [data-name=sideNavigation] .logo { height: 68px; flex: none; }
    [data-name=sideNavigation] a { display: flex; flex-direction: column; align-items: center; color: rgb(214, 221, 224); }
    [data-name=sideNavigation] a.current { color: rgb(0, 149, 210); } [data-name=sideNavigation] svg { width: 24px; height: 24px; } [data-name=sideNavigation] svg path { fill: currentColor; }</style>
</head>
<body>
<!-- Mimics Transactions on trader.degiro.nl (#/transactions?fromDate=…). Values are signed: buys negative. -->
<div data-name="app-layout">
  <!-- DEGIRO's left sidebar: one wrapper per item; the current item's link has one extra (hashed) class -->
  <aside data-name="sideNavigation" aria-label="Side menu navigation"><a class="logo" href="#/" aria-label="DEGIRO"></a><nav aria-label="primary">
    <div><div class="navCell"><a data-name="marketsMenuItem" class="navItem" href="#/markets"><i role="img" data-name="icon" data-type="area_graph_outline" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 4h16v16H4z" stroke="currentColor"></path></svg></i><span>Market</span></a></div></div>
    <div><div class="navCell"><a data-name="favouriteProductsMenuItem" class="navItem" href="#/favourites"><i role="img" data-name="icon" data-type="star_outline" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 4h16v16H4z" stroke="currentColor"></path></svg></i><span>Favourites</span></a></div></div>
    <div><div class="navCell"><a data-name="portfolioMenuItem" class="navItem" href="#/portfolio/assets"><i role="img" data-name="icon" data-type="wallet_outline" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 4h16v16H4z" stroke="currentColor"></path></svg></i><span>Portfolio</span></a></div></div>
    <span><div class="navCell"><a data-name="accountActivityMenuItem" class="navItem current" href="#/inbox"><i role="img" data-name="icon" data-type="mail" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 4h16v16H4z" stroke="currentColor"></path></svg></i><span>Inbox</span></a></div></span>
    <div><div class="navCell"><a data-name="productsMenuItem" class="navItem" href="#/products?productType=1"><i role="img" data-name="icon" data-type="products_outline" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 4h16v16H4z" stroke="currentColor"></path></svg></i><span>Products</span></a></div></div>
  </nav><nav aria-label="secondary">
    <div><a class="navItem" href="#/profile"><span>Profile</span></a></div>
    <div><a class="navItem" href="#/settings"><span>Settings</span></a></div>
    <div><a class="navItem" href="#/theme"><span>Theme</span></a></div>
    <div><a class="navItem" href="#/logout"><span>Log off</span></a></div>
  </nav></aside>
  <section data-name="transactions">
    <div>
      <div id="head">
        <h1>Transactions</h1>
        <div data-name="transactionsFilters"><form><input data-name="quickSearchInput" placeholder="Search for a product"></form>
          <!-- an open date picker: a calendar table inside the section -->
          <table id="calendar" hidden><thead><tr><th>Mo</th><th>Tu</th><th>We</th><th>Th</th><th>Fr</th><th>Sa</th><th>Su</th></tr></thead>
            <tbody><tr><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td></tr></tbody></table></div>
      </div>
      <div id="tableWrap"><div>
        <table id="transactions">
          <thead><tr><th>Product</th><th>Date</th><th>Symbol | ISIN</th><th>Exchange</th><th>Venue</th><th>Action</th><th>Qty</th><th>Price</th><th>Local value</th><th>Value</th><th>Exchange Rate</th><th>AutoFX Fee</th><th>Fees</th><th>Total</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div></div>
      <div data-name="pagination">
        <button data-name="prevPageButton" aria-label="Previous page" disabled>‹</button>
        <input data-name="goToPageInput" value="1">
        <button data-name="nextPageButton" aria-label="Next page" disabled>›</button>
      </div>
    </div>
  </section>
</div>
<script>
  // product, action, qty, local value, value, AutoFX fee, fees, total (value + fees)
  window.__TX = window.__TX || [
    ['Mock Chips ETF EUR', 'Buy', 200, '€ -3.600,00', '€ -3.600,00', '—', '€ -3,00', '€ -3.603,00'],
    ['Mock Chips ETF EUR', 'Sell', -100, '€ 1.900,00', '€ 1.900,00', '—', '€ -3,00', '€ 1.897,00'],
    ['Mock Tech Inc. Class A', 'Buy', 10, '$ -2.701,50', '€ -2.500,00', '€ -6,25', '€ -2,00', '€ -2.508,25'],
    ['Mock Tech Inc. Class A', 'Sell', -5, '$ 1.500,00', '€ 1.390,00', '—', '€ -2,00', '€ 1.388,00'],
    ['Mock Bond ETF EUR', 'Buy', 1000, '€ -2.500,00', '€ -2.500,00', '—', '€ -1,00', '€ -2.501,00']
  ];
  // localised headers (DEGIRO's German UI)
  if (window.__MOCK_TX_HEADERS) document.querySelectorAll('#transactions thead th').forEach((th, i) => { th.textContent = window.__MOCK_TX_HEADERS[i] ?? th.textContent; });
  function render() {
    const tb = document.getElementById('rows');
    tb.innerHTML = '';
    window.__TX.forEach(([name, action, qty, local, value, autofx, fee, total], i) => {
      const tr = document.createElement('tr');
      tr.dataset.id = 'row-' + i;
      tr.dataset.rowIndex = String(i);
      tr.innerHTML = `<td><a data-name="productLink"><span data-name="productName"></span></a><span data-name="productCategory">A</span></td>
        <td><span data-field="date">19/10/2026 10:00:00</span></td><td><span data-name="symbolIsin">SYM | XX000</span></td>
        <td><span data-name="exchangeAbbr">TDG</span></td><td>XGAT</td>
        <td><span data-name="buySellBadge"></span></td><td>${qty}</td><td><span data-field="price">—</span></td>
        <td><span data-field="total"></span></td><td><span data-field="totalInBaseCurrency"></span></td>
        <td>—</td><td class="autofx"></td><td><span data-field="feeInBaseCurrency"></span></td>
        <td><span data-field="totalPlusAllFeesInBaseCurrency"></span></td><td></td>`;
      tr.querySelector('[data-name=productName]').textContent = name;
      const badge = tr.querySelector('[data-name=buySellBadge]');
      badge.dataset.action = action.toUpperCase();
      badge.textContent = window.__MOCK_TX_LABELS?.[action] || action; // localised text
      badge.style.cssText = `color:${action === 'Buy' ? 'rgb(30, 131, 2)' : 'rgb(228, 1, 1)'};font-weight:500`;
      tr.querySelector('[data-field=total]').textContent = local;
      tr.querySelector('[data-field=totalInBaseCurrency]').textContent = value;
      tr.querySelector('.autofx').textContent = autofx;
      tr.querySelector('[data-field=feeInBaseCurrency]').textContent = fee;
      tr.querySelector('[data-field=totalPlusAllFeesInBaseCurrency]').textContent = total;
      if (window.__MOCK_NO_TX_FEE) tr.querySelector('[data-field=feeInBaseCurrency]').removeAttribute('data-field');
      if (window.__MOCK_NO_TX_TOTAL) tr.querySelector('[data-field=totalPlusAllFeesInBaseCurrency]').removeAttribute('data-field');
      tb.appendChild(tr);
    });
    document.querySelector('[data-name=nextPageButton]').disabled = !window.__MOCK_MORE_PAGES;
  }
  if (window.__MOCK_CALENDAR) document.getElementById('calendar').hidden = false;
  render();
  window.__rerender = render; // DEGIRO re-renders rows (new date range, paging)
</script>
</body>
</html>
