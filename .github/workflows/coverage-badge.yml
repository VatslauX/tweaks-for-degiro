name: Coverage badge

on:
  push:
    branches: [main]

# write is scoped to this workflow only: it pushes one SVG to the orphan `badges` branch, never to
# main. test.yml and release.yml keep their own separate, narrower permissions.
permissions:
  contents: write

jobs:
  badge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # unit + integration only (no Playwright/Chromium needed): scripts/coverage-badge.js runs
      # node --test itself and writes ./coverage-badge.svg locally, no network call
      - run: node scripts/coverage-badge.js
      - name: Publish to the badges branch
        run: |
          mv coverage-badge.svg /tmp/coverage-badge.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # retries: malware-badge.yml also pushes to `badges` on every push to main, so a
          # non-fast-forward rejection here is an expected race, not an error - re-fetch
          # and retry rather than failing the job
          for attempt in 1 2 3 4 5; do
            if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
              git fetch origin badges
              git checkout -B badges origin/badges
            else
              git checkout --orphan badges
              find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
            fi
            cp /tmp/coverage-badge.svg coverage-badge.svg
            git add coverage-badge.svg
            if git diff --cached --quiet; then
              echo "coverage unchanged, nothing to publish"
              break
            fi
            git commit -m "chore: update coverage badge"
            if git push origin HEAD:badges; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "failed to publish coverage badge after 5 attempts" >&2
              exit 1
            fi
            echo "push rejected (attempt $attempt/5), retrying"
            sleep $((attempt * 3))
          done
